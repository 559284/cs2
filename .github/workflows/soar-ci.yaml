name: SOAR CI/CD

on:
  workflow_dispatch:
  push:
    paths:
      - "soar/**"

jobs:
  deploy-soar:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Python syntax
        run: python3 -m py_compile soar/main.py

      - name: Deploy SOAR with AWS SSM
        run: |
          aws ssm send-command \
            --instance-ids "i-006a261a604d1b89c" \
            --document-name "AWS-RunShellScript" \
            --region eu-central-1 \
            --parameters 'commands=[
              "cd /home/ubuntu/soar",
              "curl -fsSL https://raw.githubusercontent.com/559284/cs2/main/soar/main.py -o main.py",
              ". venv/bin/activate",
              "python3 -m py_compile main.py",
              "pkill -f uvicorn || true",
              "nohup venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 > soar.log 2>&1 &"
            ]'
