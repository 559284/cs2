```yaml
name: SOAR CI/CD

on:
  workflow_dispatch:
  push:
    paths:
      - "soar/**"

jobs:
  deploy-soar:
    runs-on: self-hosted

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: eu-central-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Python syntax
        run: python3 -m py_compile soar/main.py

      - name: Test AWS credentials
        run: aws sts get-caller-identity

      - name: Deploy SOAR with AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-006a261a604d1b89c" \
            --document-name "AWS-RunShellScript" \
            --region eu-central-1 \
            --parameters 'commands=[
              "cd /home/ssm-user/soar",
              "curl -fsSL https://raw.githubusercontent.com/559284/cs2/main/soar/main.py -o main.py",
              "/home/ssm-user/soar/venv/bin/python -m py_compile main.py",
              "pkill -f uvicorn || true",
              "nohup /home/ssm-user/soar/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 > /home/ssm-user/soar/soar.log 2>&1 &"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-006a261a604d1b89c" \
            --region eu-central-1

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-006a261a604d1b89c" \
            --region eu-central-1 \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text
```
